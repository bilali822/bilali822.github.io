name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          cd latest/bin
          yes | ./sdkmanager --licenses > /dev/null 2>&1 || true
          ./sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Bubblewrap & expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get install -y expect

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          JDK_PATH: ${{ env.JAVA_HOME }}
        run: |
          expect << 'EOF'
          set timeout 900
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re "install the JDK" { send "n\r"; exp_continue }
            -re "JDK 17:" { send "$env(JDK_PATH)\r"; exp_continue }
            -re "Path to" { send "$env(JDK_PATH)\r"; exp_continue }
            -re "Continue" { send "y\r"; exp_continue }
            eof
          }
          EOF
          
          echo ""
          echo "═══ الملفات بعد البناء: ═══"
          ls -la
          echo ""
          echo "═══ ندور على APK: ═══"
          find . -name "*.apk" -o -name "*.aab"

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find . -name "app-release-signed.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          if [ -n "$APK_PATH" ]; then
            echo "✅ APK: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "❌ ما لقينا APK"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "الإصدار v1.0.${{ github.run_number }}"
          body: "تطبيق الصف العاشر — بناء تلقائي"
          files: ${{ steps.find-apk.outputs.apk_path }}
